<!DOCTYPE html>
<html>
<head>
    <title>Game-RPS</title>
    <link rel="stylesheet" href="style.css">
    <audio id="myAudio" src="Audio/shake.mp3" ></audio>
</head>
<body>
    <div class="header-container">
        <h1 class="header-text">Let's play <span class="text-rock">Rock</span> · <span class="text-paper">Paper</span>  · <span class="text-scissors">Scissors</span></h1>  
        <button id="volumeToggle" class="muted" onclick="toggleVolume()">
        <span id="buttonText">Mute</span>
        
        </button>
         <!-- Put this right above or inside your header section -->
        <div class="theme-selector-container" style="text-align: center; margin: 15px 0;">
            <label for="themeSelect" style="font-weight: bold; margin-right: 8px;"></label>
            <select id="themeSelect" onchange="switchTheme(this.value)" style="border-radius: 8px; font-weight: 600; cursor: pointer;">
            <option value="classic">Classic Light</option>
            <option value="dark">Midnight Dark</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            </select>
        </div>
    </div>
    <div>
        <p class="status">
        <strong>Wins: </strong><span id = "var-Wins">0</span> |
        <strong> Losses: </strong><span id = "var-Losses">0</span>|
        <strong> Ties: </strong><span id = "var-Ties">0</span>
        </p>
    </div>
    <div class="game-container">
        <div class="result-box">
        <p class="Result-label"><span id = "var-Result">Make your move to throw</span></p>
        </div>
        <div class="hands-display">
            <div class="move-container">
            <div class="icon-result">
                <span id = "myMove"><img src="Image/rock.png" width="80" style = "transform: rotate(-90deg)" ></span>
            </div>
            <p class="move-label">YOU</p>
        </div>
        <span class="vs-text">VS</span>
        <div class="move-container">
            <div class="icon-result">
                <span id = "compMove"><img src="Image/rock.png" width="80" style = "transform: rotate(-90deg)"></span>
            </div>
            <p class="move-label">CPU</p>
        </div>
    </div>

        </div>
        
    <div class="moveButton">
        <button class=move onclick="RockButton('Rock')">
            <img src="Image/rock.png" width="80">
        </button>
        <button class=move onclick="PaperButton('Paper')">
            <img src="Image/paper.png" width="80">
        </button>
        <button class=move onclick="ScissorsButton('Scissors')">
            <img src="Image/scissors.png" width="80">
        </button>
    </div>

    <div class=Rest>
    <button class=RestButton onclick="RestButton()">
        Rest Score
    </button>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
